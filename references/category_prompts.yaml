# ============== 1. 二次元角色驱动 ==============
二次元角色驱动:
  art_style: "anime style, cel-shaded rendering, vibrant saturated colors, clean linework, Genshin Impact style, Honkai Star Rail style, Blue Archive style"
  default_camera: "dynamic angle, character-focused composition, slight low angle for heroism"
  color_palette: "bright pastel base with high saturation accents, glowing rim light, soft bloom"
  ui_aesthetic: "anime game UI with glowing borders, semi-transparent gradient panels, holographic elements, soft drop shadows, gacha-inspired frame decorations"
  model_route:
    primary: "gemini-2.5-flash-image-preview"
    fallback: "sdxl-base"
    cfg_scale: 7.5
    denoising_strength: 0.7
  negative_extra: "modern military, photorealistic, western cartoon, realistic skin texture, hyperrealistic"
  default_subject: "anime-style characters in a fantasy world with elemental magic effects and colorful environments"
  social_slot_enabled: false
  replacement_shots:
    - id: "S7"
      name: "多角色合影 KV"
      with_ui: false
      zone_strategy: "营销引流"
      aspect_ratio: "16:9"
      composition: "group portrait with diverse characters standing together, faction or team alignment visible through poses and spacing, dynamic energy"
      subject_template: "{main_character} alongside {characters} in {key_scene}, {atmosphere_keyword} mood, faction-themed grouping"

    - id: "S8"
      name: "角色三视图"
      with_ui: true
      zone_strategy: "收集欲望"
      aspect_ratio: "9:16"
      composition: "character showcase with front/side/back views, attribute panel on the side with stats and star rating"
      subject_template: "{main_character} character model viewer in {game_name}, front/side/back views with attributes and level display, {atmosphere_keyword} theme"

    - id: "S9"
      name: "抽卡界面"
      with_ui: true
      zone_strategy: "收集欲望"
      aspect_ratio: "9:16"
      composition: "gacha reveal screen with summoning animation effects, character card emerging from light, particle effects"
      subject_template: "{game_name} gacha summon screen, {featured_character} SSR card reveal with particle effects and golden light, pull history and rate info on side"

