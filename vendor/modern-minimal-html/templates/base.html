<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文档标题</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--color-background-body:#F5F0EB;       /* 页面整体底色，暖白 */
  --color-background-primary:#FFFFFF;     /* 卡片/主体背景，纯白 */
  --color-background-secondary:#F4F4F2;  /* 次要背景（表头/高亮区） */
  --color-text-primary:#1A1A1A;
  --color-text-secondary:#666;
  --color-text-tertiary:#999;
  --color-border-tertiary:#E4E4E2;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC",sans-serif;
  --border-radius-lg:8px;
  --border-radius-md:6px;
}
body{font-family:var(--font-sans);color:var(--color-text-primary);background:var(--color-background-body)}
.wrap{max-width:960px;margin:0 auto;padding:2rem 1.5rem}
.sec-label{font-size:11px;font-weight:500;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.07em;padding-bottom:.5rem;border-bottom:.5px solid var(--color-border-tertiary);margin-bottom:1.1rem}
.section-title{font-size:16px;font-weight:600;color:var(--color-text-primary);padding-bottom:.5rem;border-bottom:.5px solid var(--color-border-tertiary);margin-bottom:1.1rem;letter-spacing:.02em}
.section{margin-bottom:2.2rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.card{background:var(--color-background-primary);border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:14px 16px}
.card-title{font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:7px}
.card-body{font-size:12px;color:var(--color-text-secondary);line-height:1.7}
.tag{display:inline-block;font-size:10px;font-weight:500;padding:2px 6px;border-radius:3px;margin:2px}
.tb{background:#E6F1FB;color:#0C447C}
.tt{background:#E1F5EE;color:#085041}
.ta{background:#FAEEDA;color:#633806}
.tc{background:#FAECE7;color:#4A1B0C}
.tp{background:#EEEDFE;color:#26215C}
.tg{background:#F2F2F0;color:#555}
/* ↓↓↓ 更多组件 CSS 见 SKILL.md ↓↓↓ */
</style>
</head>
<body>
<div class="wrap">

  <!-- SECTION: TITLE -->
  <div class="section-title">文档标题</div>
  <div class="sec-label">Section — description</div>

  <!-- SECTION: 指标卡片 -->
  <div class="section">
    <div class="grid-4">
      <div class="metric-card"><div class="metric-label">指标A</div><div class="metric-value">XX</div><div class="metric-sub">说明</div></div>
      <div class="metric-card"><div class="metric-label">指标B</div><div class="metric-value">XX</div><div class="metric-sub">说明</div></div>
      <div class="metric-card"><div class="metric-label">指标C</div><div class="metric-value">XX</div><div class="metric-sub">说明</div></div>
      <div class="metric-card"><div class="metric-label">指标D</div><div class="metric-value">XX</div><div class="metric-sub">说明</div></div>
    </div>
  </div>

  <!-- SECTION: 内容卡片 -->
  <div class="section">
    <div class="grid2">
      <div class="card"><div class="card-title">卡片1</div><div class="card-body">内容...</div></div>
      <div class="card"><div class="card-title">卡片2</div><div class="card-body">内容...</div></div>
    </div>
  </div>

</div>
</body>
</html>
